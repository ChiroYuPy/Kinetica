[package]
name = "kinetica"
description = "A 2D rigid-body physics engine for games."
keywords = ["physics", "2d", "gamedev", "rigid-body"]
categories = ["game-development", "simulation"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
## Serialize and deserialize worlds (save games, replays) and descriptions (level files).
serde = ["dep:serde", "glam/serde"]
## Measure how long each stage of a step takes, read with `World::profile`.
profile = []

[dependencies]
glam.workspace = true
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
