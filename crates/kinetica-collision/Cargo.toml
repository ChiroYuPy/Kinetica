[package]
name = "kinetica-collision"
description = "2D shapes and collision detection: the geometry under the Kinetica physics engine."
keywords = ["collision", "geometry", "2d", "gamedev"]
categories = ["game-development", "mathematics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
